<!DOCTYPE html>
<html lang="es">
<head>

    <title>Panel de Válvula 1</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">

<body>

    <div class="panel" id="mainPanel">
        <h2>Sistema Acceso Control Válvula Reynolds</h2>
        <p>>>> Ω Para No Derramar Fluido <<<</p>
        
        <input type="number" id="respuestaAlumno" placeholder="---" autocomplete="off" oninput="controlarTeclado(this)" onkeydown="verificarEnter(event)">

        <br>

            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
        </svg>
        
        <div id="mensaje"></div>
        <p class="status" id="statusMQTT">Iniciando enlace satélite...</p>
    </div>

    <script src="../js/servo3.js"></script>

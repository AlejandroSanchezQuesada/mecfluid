<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AQUALAB - Sector 11 Master</title>
    <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="../css/narrador.css">
</head>
<body>

    <div id="pantalla-inicio" class="pantalla activa">
        <div class="boton-inicio" onclick="irANarrador()" title="Iniciar Sistema"></div>
    </div>

    <div id="pantalla-narrador" class="pantalla">
        <div id="filtro-oscuro"></div>
        <div id="caja-narrador">
            <img id="foto-narrador" src="../imagenes/chico111.png" alt="Retrato del narrador">
            <div id="texto-narrador"></div>
        </div>
        <button id="btn-mision" class="btn-ui" onclick="irAAlerta()">[ ABRIR PROTOCOLO ]</button>
    </div>

    <div id="pantalla-alerta" class="pantalla">
        <h1 class="u-texto-ff073a--tamano-50px">SISTEMA COMPROMETIDO</h1>
        <div id="texto-historia"></div>
        <button id="btn-start" class="btn-ui" onclick="irAMapa()">[ ACCEDER AL SECTOR 11 ]</button>
    </div>

    <div id="pantalla-mapa" class="pantalla">
        <h1 class="titulo-mapa">ESTADO GLOBAL: SECTOR 11</h1>
        <div class="contenedor-mapa u-fondo-url-imagenes-mapa-neon">
            <div class="nodo nodo-rojo" id="main-1" onclick="abrirHabitacion(1)">1</div>
            <div class="nodo nodo-bloqueado" id="main-2">2</div>
            <div class="nodo nodo-bloqueado" id="main-3">3</div>
            <div class="nodo nodo-bloqueado" id="main-4">4</div>
        </div>
    </div>

    <div id="pantalla-habitacion" class="pantalla">
        <h1 class="titulo-mapa" id="titulo-hab">HABITACIÓN 1: CONTROL</h1>
        <div class="contenedor-mapa u-fondo-rgba-0-255-255-0-05--borde-estilo-dashed">
            <div class="nodo nodo-rojo" id="sub-1" onclick="irAProblema(1)">A</div>
            <div class="nodo nodo-bloqueado" id="sub-2">B</div>
            <div class="nodo nodo-bloqueado" id="sub-3">C</div>
            <div class="nodo nodo-bloqueado" id="sub-4">D</div>
        </div>
        <button class="btn-ui u-margen-sup-15px" onclick="irAMapa()">[ VOLVER ]</button>
    </div>

    <div id="pantalla-valvula" class="pantalla">
        <div class="panel-azul">
            <div id="paso-info">PASO 1/3</div>
            <h2 class="u-texto-ffffff--margen-10px0">CONVERSIÓN DE PRESIÓN</h2>
            <div id="enunciado"></div>
            <input type="number" id="inputRes" step="any" placeholder="0.00">
            <br>
            <button class="btn-ui" onclick="verificarRes()">[ VERIFICAR ]</button>
            <div id="feed"></div>
        </div>
    </div>

    <script src="../js/narrador.js"></script>
</body>
</html>
